<!doctype html>
<html lang="en"><head>
<title>Sign in | Echoreply</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<div class="wrap" style="max-width:460px">
  <header class="nav"><a class="logo" href="/">Echoreply</a></header>
  <main class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-login" aria-selected="true">Sign in</button>
      <button role="tab" id="tab-register" aria-selected="false">Create account</button>
    </div>
    <form id="f" novalidate>
      <div class="field" id="name-f" hidden><label for="name">Your name</label><input id="name" autocomplete="name" maxlength="60"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div>
      <label class="check" id="terms-f" hidden><input type="checkbox" id="terms"><span>I agree to the <a href="/legal#terms" target="_blank">Terms</a> and <a href="/legal#privacy" target="_blank">Privacy Policy</a>.</span></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" id="go" style="width:100%">Sign in</button>
    </form>
  </main>
</div>
<script src="/js/config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
<script type="module" src="/js/firebase-init.js"></script>
</body></html>
