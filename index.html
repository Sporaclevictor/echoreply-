<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echoreply: WhatsApp replies that sound like you</title>
<meta name="description" content="Echoreply learns how you text and answers WhatsApp messages in your voice while you're busy.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#101828; --muted:#5A6478; --line:#D9DEE8;
  --accent:#5B3DF5; --accent-ink:#FFFFFF; --reply:#CFF3DF; --reply-ink:#0E3B25;
  --bad:#C2271B; --ok:#1B7F4B; --warn:#9A6200;
  --font-head:'Bricolage Grotesque',system-ui,sans-serif; --font-body:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1320;--surface:#171C2D;--ink:#EEF1F8;--muted:#9AA4BA;--line:#2A3148;--accent:#8B77FF;--accent-ink:#0F1320;--reply:#1D4A35;--reply-ink:#D8F7E6;--bad:#FF7B70;--ok:#5FD39B;--warn:#F2B84B}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font-body)}
h1,h2,h3{font-family:var(--font-head);line-height:1.1;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:800}
h2{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 1em;max-width:66ch}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{width:min(1080px,100% - 2rem);margin-inline:auto}
.narrow{width:min(460px,100% - 2rem);margin-inline:auto}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 0;gap:1rem;flex-wrap:wrap}
.logo{font-family:var(--font-head);font-weight:800;font-size:1.4rem;text-decoration:none;color:var(--ink)}
.nav nav{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  font:600 1rem var(--font-body);padding:.65rem 1.1rem;border-radius:999px;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.sm{padding:.35rem .8rem;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-weight:600;margin:0 0 .3rem}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.65rem .8rem}
textarea{min-height:110px;resize:vertical}
.field{margin-bottom:1rem}
.check{display:flex;gap:.7rem;align-items:flex-start;margin:0 0 .9rem;font-weight:400}
.check input{width:22px;height:22px;margin-top:.15rem;flex:none;accent-color:var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line);font-weight:400}
.switch input{width:46px;height:26px;accent-color:var(--accent);flex:none}
.err{color:var(--bad);font-weight:600;min-height:1.4em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.4rem;margin-bottom:1.2rem}
.row{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:1.2rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:999px;font-size:.82rem;font-weight:700;border:1.5px solid currentColor}
.badge.ok{color:var(--ok)} .badge.bad{color:var(--bad)} .badge.warn{color:var(--warn)} .badge.pro{color:var(--accent)}
.stat{font-family:var(--font-head);font-size:2rem;font-weight:800;line-height:1}
.qr{display:block;margin:1rem auto;width:280px;max-width:100%;border-radius:12px;background:#fff;padding:6px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.2rem;display:flex;flex-direction:column;gap:.6rem;min-height:340px;box-shadow:0 20px 50px -30px rgba(16,24,40,.45)}
.bubble{max-width:82%;padding:.55rem .85rem;border-radius:16px;font-size:.98rem;line-height:1.4}
.bubble.in{background:var(--bg);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:var(--reply);color:var(--reply-ink);align-self:flex-end;border-bottom-right-radius:4px}
.bubble.past{opacity:.55;font-size:.88rem}
.demo-label{font-size:.82rem;color:var(--muted);margin:.4rem 0 0}
.typing{align-self:flex-end;color:var(--muted);font-size:.85rem}
.hero{display:grid;gap:3rem;grid-template-columns:1.1fr .9fr;align-items:center;padding:3rem 0 4rem}
.hero .lede{font-size:1.2rem;color:var(--muted)}
.section{padding:3rem 0}
.steps{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:.8rem}
.steps li::before{content:counter(s);font-family:var(--font-head);font-weight:800;font-size:1.6rem;display:block}
.price{display:grid;gap:1.2rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
.price .big{font-family:var(--font-head);font-size:3rem;font-weight:800;line-height:1}
.price ul{padding-left:1.2rem;margin:1rem 0 1.4rem}
.price .pro-card{border:2px solid var(--accent)}
footer{padding:2.5rem 0;border-top:1px solid var(--line);margin-top:3rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:700;color:var(--muted)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.tabs button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:.5rem 1rem;border-radius:999px;font:600 .95rem var(--font-body);cursor:pointer;min-height:40px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(10,14,28,.6);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.modal{background:var(--surface);border-radius:18px;padding:1.6rem;width:min(560px,100%);max-height:92vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;z-index:99;font-weight:600;max-width:92vw}
#toast.bad{background:var(--bad);color:#fff}
.legal h2{margin-top:2rem;font-size:1.4rem}
.legal p,.legal li{max-width:75ch}
.setup{border:2px dashed var(--warn);border-radius:16px;padding:1.4rem;margin:2rem 0;background:var(--surface)}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:1rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
/* =====================================================================
   SETTINGS: fill these in (they are public identifiers, not secrets)
   ===================================================================== */
const CONFIG = {
  // URL of your WhatsApp worker, no trailing slash. Example: https://echoreply-worker.onrender.com
  API_BASE: 'https://YOUR-WORKER-URL',
  // Firebase console > Project settings > General > Your apps > Web app
  firebase: {
    apiKey: 'AIzaSyBWjd_9WhqO6IaAgT_EBxIPDj54-zBRmEs',
    authDomain: 'echoreply-87d81.firebaseapp.com',
    projectId: 'echoreply-87d81',
    storageBucket: 'echoreply-87d81.firebasestorage.app',
    messagingSenderId: '423050648217',
    appId: '1:423050648217:web:853e4137488e4c86217608'
  }
};
/* ===================================================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, deleteUser }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const firebaseOk = !Object.values(CONFIG.firebase).some((v) => /YOUR/i.test(v));
const workerOk = !/YOUR/i.test(CONFIG.API_BASE);
const configured = firebaseOk && workerOk;
let auth = null, authReady = Promise.resolve(null);
if (firebaseOk) {
  auth = getAuth(initializeApp(CONFIG.firebase));
  authReady = new Promise((res) => { const off = onAuthStateChanged(auth, (u) => { res(u); off(); }); });
}

/* ---------- helpers ---------- */
const root = document.getElementById('root');
let timers = [], routeId = 0;
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const every = (fn, ms) => { const t = setInterval(fn, ms); timers.push(t); return t; };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
let toastTimer;
function toast(msg, bad) {
  let t = document.getElementById('toast');
  if (!t) { t = h('div', { id: 'toast', role: 'status' }); document.body.append(t); }
  t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3500);
}
const money = (n, cur) => { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }).format(n); } catch (e) { return n + ' ' + cur; } };
const fmtDate = (ms) => (ms ? new Date(ms).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '-');
async function act(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message, true); } finally { if (btn) btn.disabled = false; }
}
async function api(path, method = 'GET', body) {
  if (!configured) throw new Error('The server is not connected yet. Set API_BASE at the top of index.html.');
  const headers = { 'Content-Type': 'application/json' };
  if (path !== '/config') {
    const user = auth.currentUser || (await authReady);
    if (user) headers.Authorization = 'Bearer ' + (await user.getIdToken());
  }
  let res;
  try { res = await fetch(CONFIG.API_BASE + '/api' + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) }); }
  catch (e) { throw new Error('Cannot reach the server. Check your connection and try again.'); }
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty */ }
  if (!res.ok) { const err = new Error(data.error || 'Something went wrong. Try again.'); err.status = res.status; err.code = data.code; throw err; }
  return data;
}
const go = (hash) => { location.hash = hash; };
const logout = async () => { if (auth) await signOut(auth); go('#/'); };

/* ---------- page shell ---------- */
function shell(navItems, ...content) {
  return [
    h('header', { class: 'nav' }, h('a', { class: 'logo', href: '#/' }, 'Echoreply'), h('nav', { 'aria-label': 'Main' }, navItems)),
    h('main', {}, content)
  ];
}
const footer = () => h('footer', {},
  h('div', { class: 'row', style: 'justify-content:space-between' }, h('span', {}, 'Echoreply'),
    h('span', {}, h('a', { href: '#/terms' }, 'Terms'), '   ', h('a', { href: '#/privacy' }, 'Privacy'))),
  h('p', { class: 'small', style: 'margin-top:1rem' }, 'Echoreply is an independent service and is not affiliated with, endorsed by, or sponsored by WhatsApp or Meta.'));
const setupNotice = () => configured ? null : h('div', { class: 'setup' },
  h('h3', {}, 'Setup needed'),
  h('p', { class: 'small', style: 'margin:0' }, firebaseOk
    ? 'Firebase is connected. One step left: deploy the WhatsApp worker, then set API_BASE at the top of index.html to its URL. Until then, sign-up, pricing and the dashboard are disabled.'
    : 'Open index.html and fill in CONFIG at the top of the script (Firebase web config and worker URL).'));

/* ---------- landing ---------- */
function landing() {
  const grid = h('div', { class: 'price' });
  const demo = h('div', { class: 'demo', 'aria-label': 'Example conversation', 'aria-live': 'polite' });
  const view = [h('div', { class: 'wrap' },
    ...shell([
      h('a', { class: 'btn sm', href: '#pricing', onclick: (e) => { e.preventDefault(); document.getElementById('pricing').scrollIntoView(); } }, 'Pricing'),
      h('a', { class: 'btn sm', href: '#/login' }, 'Sign in'),
      h('a', { class: 'btn sm primary', href: '#/register' }, 'Create account')],
      setupNotice(),
      h('section', { class: 'hero' },
        h('div', {}, h('h1', {}, 'Your WhatsApp, answering the way you would.'),
          h('p', { class: 'lede' }, "Echoreply learns how you text: your slang, your emoji, your one-word answers. Then it replies to people while you're busy. You approve everything before it connects, and you can switch it off any time."),
          h('div', { class: 'row' }, h('a', { class: 'btn primary', href: '#/register' }, 'Start free'),
            h('a', { class: 'btn', href: '#how', onclick: (e) => { e.preventDefault(); document.getElementById('how').scrollIntoView(); } }, 'See how it works'))),
        h('div', {}, demo, h('p', { class: 'demo-label' }, "Example only. Replies match each owner's own style."))),
      h('section', { class: 'section', id: 'how' }, h('h2', {}, 'Set up in about two minutes'),
        h('ol', { class: 'steps' },
          h('li', {}, h('h3', {}, 'Say yes, in writing'), h('p', { class: 'muted' }, 'Read what we access and tick each consent box. Your choice is recorded, and you can withdraw it later.')),
          h('li', {}, h('h3', {}, 'Scan one QR code'), h('p', { class: 'muted' }, 'Link your WhatsApp from your phone, the same way you link WhatsApp Web.')),
          h('li', {}, h('h3', {}, 'We learn your style'), h('p', { class: 'muted' }, 'Echoreply reads messages you wrote to pick up how you text, then drafts replies in that voice.')),
          h('li', {}, h('h3', {}, 'Pause whenever'), h('p', { class: 'muted' }, 'Turn replies off, disconnect, or delete everything from your dashboard.')))),
      h('section', { class: 'section' }, h('h2', {}, 'Built for consent'),
        h('p', {}, "People who message you are told a reply is automated, and anyone can send STOP to opt out. We don't store your conversations: only a count of replies is kept so plan limits work.")),
      h('section', { class: 'section', id: 'pricing' }, h('h2', {}, 'Pricing'), grid),
      footer()))];
  root.replaceChildren(...view);

  api('/config').then((c) => {
    grid.append(
      h('div', { class: 'panel' }, h('h3', {}, 'Free'), h('div', { class: 'big' }, money(0, c.currency)),
        h('ul', {}, h('li', {}, `${c.free_daily_limit} automatic replies per day`), h('li', {}, 'Learns from your recent messages'), h('li', {}, 'Automated-reply notice always on')),
        h('a', { class: 'btn', href: '#/register' }, 'Start free')),
      h('div', { class: 'panel pro-card' }, h('h3', {}, 'Premium'),
        h('div', { class: 'big' }, money(c.price, c.currency), h('span', { class: 'small muted' }, ` / ${c.premium_days} days`)),
        h('ul', {}, h('li', {}, 'Unlimited automatic replies'), h('li', {}, 'Custom instructions for your replies'), h('li', {}, 'Deeper style learning and longer chat context'), h('li', {}, 'Choose whether to show the automated-reply notice')),
        h('a', { class: 'btn primary', href: '#/register' }, 'Get Premium')));
  }).catch(() => { grid.textContent = 'Pricing is unavailable right now.'; });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const live = ['hey are we still on for saturday?', 'yesss saturday works!! what time were we thinking \u{1F64C}'];
  [['in', 'bro u free later?'], ['out', 'nah slammed till 8 \u{1F629} tmrw?']].forEach(([k, t]) => demo.append(h('div', { class: 'bubble past ' + k }, t)));
  const inB = h('div', { class: 'bubble in' }, live[0]);
  const out = h('div', { class: 'bubble out' });
  if (reduce) { demo.append(inB, out); out.textContent = live[1]; return; }
  later(() => demo.append(inB), 600);
  later(() => {
    const dots = h('div', { class: 'typing' }, 'typing...'); demo.append(dots);
    later(() => { dots.remove(); demo.append(out); let i = 0; const chars = [...live[1]];
      const tick = every(() => { out.textContent = chars.slice(0, ++i).join(''); if (i >= chars.length) clearInterval(tick); }, 38); }, 1200);
  }, 1800);
}

/* ---------- sign in / register ---------- */
const FRIENDLY = {
  'auth/invalid-credential': 'Email or password is incorrect.', 'auth/wrong-password': 'Email or password is incorrect.',
  'auth/user-not-found': 'Email or password is incorrect.', 'auth/email-already-in-use': 'An account with this email already exists. Sign in instead.',
  'auth/weak-password': 'Use a password with at least 8 characters.', 'auth/invalid-email': 'Enter a valid email address.',
  'auth/user-disabled': 'Your account has been suspended.', 'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.',
  'auth/network-request-failed': 'Cannot reach the server. Check your connection.'
};
const say = (e) => FRIENDLY[e.code] || e.message || 'Something went wrong. Try again.';

function authView(reg) {
  const name = h('input', { id: 'name', autocomplete: 'name', maxlength: '60' });
  const email = h('input', { id: 'email', type: 'email', autocomplete: 'email', required: true });
  const pw = h('input', { id: 'password', type: 'password', autocomplete: reg ? 'new-password' : 'current-password', minlength: '8', required: true });
  const terms = h('input', { type: 'checkbox', id: 'terms' });
  const err = h('p', { class: 'err', role: 'alert' });
  const go1 = h('button', { class: 'btn primary', style: 'width:100%' }, reg ? 'Create account' : 'Sign in');
  const form = h('form', { novalidate: true },
    reg ? h('div', { class: 'field' }, h('label', { for: 'name' }, 'Your name'), name) : null,
    h('div', { class: 'field' }, h('label', { for: 'email' }, 'Email'), email),
    h('div', { class: 'field' }, h('label', { for: 'password' }, 'Password'), pw),
    reg ? h('label', { class: 'check' }, terms, h('span', {}, 'I agree to the ', h('a', { href: '#/terms', target: '_blank' }, 'Terms'), ' and ', h('a', { href: '#/privacy', target: '_blank' }, 'Privacy Policy'), '.')) : null,
    err, go1);
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = ''; go1.disabled = true;
    try {
      if (!configured) throw new Error('The server is not connected yet. Set API_BASE at the top of index.html.');
      if (reg) {
        if (!name.value.trim()) throw new Error('Enter your name.');
        if (pw.value.length < 8) throw new Error('Use a password with at least 8 characters.');
        if (!terms.checked) throw new Error('Accept the Terms and Privacy Policy to continue.');
        await createUserWithEmailAndPassword(auth, email.value.trim(), pw.value);
        try { await api('/auth/init', 'POST', { name: name.value.trim(), accept_terms: true }); }
        catch (x) { await deleteUser(auth.currentUser).catch(() => {}); throw x; }
        go('#/dashboard');
      } else {
        await signInWithEmailAndPassword(auth, email.value.trim(), pw.value);
        const me = await api('/me');
        go(me.user.role === 'admin' ? '#/admin' : '#/dashboard');
      }
    } catch (x) { err.textContent = say(x); } finally { go1.disabled = false; }
  });
  root.replaceChildren(h('div', { class: 'narrow' }, h('header', { class: 'nav' }, h('a', { class: 'logo', href: '#/' }, 'Echoreply')),
    h('main', { class: 'panel' },
      h('div', { class: 'tabs', role: 'tablist' },
        h('button', { role: 'tab', 'aria-selected': !reg, onclick: () => go('#/login') }, 'Sign in'),
        h('button', { role: 'tab', 'aria-selected': reg, onclick: () => go('#/register') }, 'Create account')),
      setupNotice(), form)));
}

/* ---------- user dashboard ---------- */
async function dashboard() {
  const myRoute = routeId;
  root.replaceChildren(h('div', { class: 'wrap' }, ...shell([], h('p', { class: 'muted' }, 'Loading...'))));
  let me, cfg;
  const load = async () => {
    try { [me, cfg] = await Promise.all([api('/me'), api('/config')]); }
    catch (e) {
      if (myRoute !== routeId) return;
      if (e.status === 401 || e.status === 403 || e.code === 'no_profile' || !configured) { toast(e.message, true); later(() => go('#/login'), 1200); }
      else root.replaceChildren(h('div', { class: 'wrap' }, ...shell([], h('p', { class: 'err' }, e.message))));
      return;
    }
    if (myRoute !== routeId) return;
    draw();
    if (['starting', 'qr'].includes(me.wa.status)) later(load, 2500);
  };

  const labelFor = (s) => ({ connected: 'Connected', qr: 'Waiting for scan', starting: 'Starting', error: 'Error', idle: 'Not connected' }[s] || s);

  function draw() {
    const premium = me.user.plan === 'premium';
    const left = Math.max(0, me.usage.free_daily_limit - me.usage.replies_today);
    const nav = [h('span', { class: 'muted small' }, me.user.name),
      me.user.role === 'admin' ? h('a', { class: 'btn sm', href: '#/admin' }, 'Admin') : null,
      h('button', { class: 'btn sm', onclick: logout }, 'Sign out')];

    const status = h('section', { class: 'panel' }, h('div', { class: 'grid' },
      h('div', {}, h('p', { class: 'muted small' }, 'Plan'), h('div', { class: 'stat' }, premium ? 'Premium' : 'Free'),
        h('p', { class: 'small muted' }, premium ? 'Active until ' + fmtDate(me.user.premium_until) : 'Upgrade for unlimited replies')),
      h('div', {}, h('p', { class: 'muted small' }, 'Replies sent today'), h('div', { class: 'stat' }, String(me.usage.replies_today)),
        h('p', { class: 'small muted' }, premium ? 'No daily limit' : `${left} left today`)),
      h('div', {}, h('p', { class: 'muted small' }, 'WhatsApp'),
        h('span', { class: 'badge ' + (me.wa.status === 'connected' ? 'ok' : 'warn') }, labelFor(me.wa.status)),
        me.wa.phone ? h('p', { class: 'small muted' }, '+' + me.wa.phone) : null)));

    const reload = () => load();
    const conn = h('section', { class: 'panel' }, h('h2', {}, 'Connect WhatsApp'));
    const st = me.wa.status;
    if (st === 'connected') {
      conn.append(h('p', {}, `Connected. Echoreply has learned from ${me.wa.samples} of your messages.`),
        h('div', { class: 'row' },
          h('button', { class: 'btn', onclick: (e) => act(e.target, async () => { const r = await api('/wa/learn', 'POST'); toast(`Learned from ${r.samples} messages`); reload(); }) }, 'Re-learn my style'),
          h('button', { class: 'btn danger', onclick: (e) => act(e.target, async () => { await api('/wa/disconnect', 'POST'); reload(); }, 'Disconnected') }, 'Disconnect')));
    } else if (st === 'qr' || st === 'starting') {
      conn.append(st === 'qr'
        ? [h('p', {}, 'On your phone, open WhatsApp, go to Settings, then Linked devices, tap Link a device, and scan this code.'), h('img', { class: 'qr', src: me.wa.qr, alt: 'WhatsApp QR code' })]
        : h('p', { class: 'muted' }, 'Starting your session. This can take up to a minute.'),
        h('button', { class: 'btn', onclick: (e) => act(e.target, async () => { await api('/wa/disconnect', 'POST'); reload(); }) }, 'Cancel'));
    } else {
      if (st === 'error') conn.append(h('p', { class: 'err' }, me.wa.error || 'Something went wrong.'));
      conn.append(h('p', { class: 'muted' }, 'Before connecting, you will review exactly what Echoreply accesses and give your consent.'),
        h('button', { class: 'btn primary', onclick: async () => { if (me.consent) { try { await api('/wa/connect', 'POST'); reload(); } catch (e) { toast(e.message, true); } } else consentModal(); } }, 'Connect WhatsApp'));
    }

    const persona = h('textarea', { id: 'persona', maxlength: '800', placeholder: 'Example: I run a bakery. Share opening hours (8am-6pm) and say I will confirm orders personally.', disabled: !premium }, me.wa.persona || '');
    const settings = h('section', { class: 'panel' }, h('h2', {}, 'Reply settings'),
      h('label', { class: 'switch' }, h('span', {}, 'Automatic replies', h('br'), h('span', { class: 'small muted' }, 'Pause to stop all replies instantly.')),
        h('input', { type: 'checkbox', checked: me.wa.auto_reply, onchange: (e) => act(null, () => api('/wa/settings', 'POST', { auto_reply: e.target.checked }), e.target.checked ? 'Replies on' : 'Replies paused') })),
      h('label', { class: 'switch' }, h('span', {}, 'Show "automated reply" notice', h('br'), h('span', { class: 'small muted' }, premium ? 'Shown once per contact per day.' : 'Always on for Free. Premium can turn it off.')),
        h('input', { type: 'checkbox', checked: me.wa.disclosure || !premium, disabled: !premium, onchange: (e) => act(null, () => api('/wa/settings', 'POST', { disclosure: e.target.checked })) })),
      h('div', { class: 'field', style: 'margin-top:1rem' }, h('label', { for: 'persona' }, 'Custom instructions ', h('span', { class: 'badge pro' }, 'Premium')), persona,
        h('button', { class: 'btn sm', style: 'margin-top:.6rem', disabled: !premium, onclick: (e) => act(e.target, () => api('/wa/settings', 'POST', { persona: persona.value }), 'Saved') }, 'Save instructions')));

    const upgrade = h('section', { class: 'panel' }, h('h2', {}, premium ? 'Extend Premium' : 'Upgrade to Premium'));
    const info = h('div', {}, h('p', { class: 'muted' }, 'Loading payment details...'));
    upgrade.append(info);
    const payBox = h('div', { style: 'margin-top:1.2rem' });
    const loadPayments = async () => {
      const rows = await api('/payments').catch(() => []);
      if (!rows.length) return payBox.replaceChildren();
      payBox.replaceChildren(h('h3', {}, 'Your payments'), h('div', { class: 'tablewrap' }, h('table', {},
        h('tr', {}, ['Date', 'Reference', 'Amount', 'Status'].map((t) => h('th', {}, t))),
        rows.map((r) => h('tr', {}, h('td', {}, fmtDate(r.created_at)), h('td', {}, r.reference), h('td', {}, money(r.amount, r.currency)),
          h('td', {}, h('span', { class: 'badge ' + ({ confirmed: 'ok', rejected: 'bad', pending: 'warn' }[r.status]) }, r.status)))))));
    };
    api('/payment-info').then((i) => {
      const ref = h('input', { id: 'ref', maxlength: '80', placeholder: 'Bank transaction reference' });
      const note = h('input', { id: 'note', maxlength: '300', placeholder: 'Note (optional)' });
      info.replaceChildren(h('p', {}, `${money(i.price, i.currency)} for ${i.premium_days} days.`),
        h('div', { class: 'panel', style: 'background:var(--bg)' },
          h('p', { style: 'margin:0' }, h('strong', {}, 'Bank: '), i.bank_name),
          h('p', { style: 'margin:0' }, h('strong', {}, 'Account number: '), i.account_number),
          h('p', { style: 'margin:0' }, h('strong', {}, 'Account name: '), i.account_name)),
        h('p', { class: 'muted small' }, i.instructions),
        h('div', { class: 'field' }, h('label', { for: 'ref' }, 'Transaction reference'), ref),
        h('div', { class: 'field' }, h('label', { for: 'note' }, 'Note'), note),
        h('button', { class: 'btn primary', onclick: (e) => act(e.target, async () => { await api('/payments', 'POST', { reference: ref.value, note: note.value }); ref.value = ''; note.value = ''; loadPayments(); }, 'Payment submitted. We will confirm it soon.') }, 'Submit payment'),
        payBox);
      loadPayments();
    }).catch(() => {});

    const danger = h('section', { class: 'panel' }, h('h2', {}, 'Your data'),
      h('p', { class: 'muted' }, 'Withdrawing consent disconnects WhatsApp and deletes your saved style samples and linked session. Deleting your account removes everything.'),

        h('button', { class: 'btn danger', disabled: !me.consent, onclick: (e) => confirm('Withdraw consent and disconnect WhatsApp?') && act(e.target, async () => { await api('/consent', 'DELETE'); reload(); }, 'Consent withdrawn') }, 'Withdraw consent'),

    root.replaceChildren(h('div', { class: 'wrap' }, ...shell(nav, h('h1', { style: 'font-size:2.2rem' }, `Hi ${me.user.name.split(' ')[0]}`), status, conn, settings, upgrade, danger)));
  }

  function consentModal() {
    const items = [
      ['ownership', 'I own this WhatsApp account and number, and I am allowed to connect it.'],
      ['data_processing', 'I understand Echoreply will read incoming messages and messages I wrote in my recent chats to learn my style. The text of the incoming message, recent chat context and my sample messages are sent to a third-party AI provider (Anthropic) to write replies. Echoreply does not store conversation content, only a reply count.'],
      ['risk_and_law', 'I understand this connects through an unofficial method that WhatsApp does not endorse, and WhatsApp may restrict or ban my number. I accept this risk, I will follow the laws that apply to me, and I understand replies include an automated notice and contacts can opt out by sending STOP.']
    ];
    const boxes = items.map(([id, text]) => h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'c-' + id }), h('span', {}, text)));
    const err = h('p', { class: 'err', role: 'alert' });
    const close = () => ov.remove();
    const ok = h('button', { class: 'btn primary', onclick: async (e) => {
      const chosen = items.filter(([id]) => document.getElementById('c-' + id).checked).map(([id]) => id);
      if (chosen.length < items.length) { err.textContent = 'Tick every box to continue.'; return; }
      e.target.disabled = true;
      try { await api('/consent', 'POST', { items: chosen, version: cfg.consent_version }); await api('/wa/connect', 'POST'); close(); load(); }
      catch (x) { err.textContent = x.message; e.target.disabled = false; }
    } }, 'I agree and continue');
    const ov = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'cm-t' },
      h('div', { class: 'modal' }, h('h2', { id: 'cm-t' }, 'Your consent'),
        h('p', { class: 'muted' }, 'Please read and confirm each statement. Your consent is recorded with the date and version, and you can withdraw it any time from your dashboard.'),
        boxes, err, h('div', { class: 'row' }, ok, h('button', { class: 'btn', onclick: close }, 'Cancel'))));
    document.body.append(ov);
  }
  load();
}

/* ---------- admin panel ---------- */
function admin() {
  const myRoute = routeId;
  const TABS = { overview: 'Overview', users: 'Users', payments: 'Payments', settings: 'Settings' };
  const tabsEl = h('div', { class: 'tabs', role: 'tablist' });
  const view = h('div', { 'aria-live': 'polite' });
  let current = 'overview';
  root.replaceChildren(h('div', { class: 'wrap' }, ...shell([h('a', { class: 'btn sm', href: '#/dashboard' }, 'My dashboard'), h('button', { class: 'btn sm', onclick: logout }, 'Sign out')], tabsEl, view)));

  const drawTabs = () => tabsEl.replaceChildren(...Object.entries(TABS).map(([k, label]) => h('button', { role: 'tab', 'aria-selected': k === current, onclick: () => show(k) }, label)));
  async function show(tab, arg) {
    current = tab; drawTabs();
    view.replaceChildren(h('p', { class: 'muted' }, 'Loading...'));
    try { await ({ overview, users, payments, settings })[tab](arg); }
    catch (e) {
      if (myRoute !== routeId) return;
      if (e.status === 401 || e.status === 403 || !configured) { toast(e.message, true); later(() => go('#/login'), 1200); }
      else view.replaceChildren(h('p', { class: 'err' }, e.message));
    }
  }

  async function overview() {
    const s = await api('/admin/stats');
    const stat = (label, v) => h('div', { class: 'panel' }, h('p', { class: 'muted small', style: 'margin:0' }, label), h('div', { class: 'stat' }, String(v)));
    view.replaceChildren(h('div', { class: 'grid' },
      stat('Users', s.users), stat('Premium users', s.premium), stat('Banned', s.banned),
      stat('WhatsApp connected', s.connected), stat('Pending payments', s.pending_payments), stat('Replies today (UTC)', s.replies_today),
      stat('Confirmed revenue', s.revenue.length ? s.revenue.map((r) => money(r.total, r.currency)).join(', ') : '0')));
  }

  async function users(q = '') {
    const rows = await api('/admin/users?q=' + encodeURIComponent(q));
    const search = h('input', { type: 'search', placeholder: 'Search name or email', value: q, 'aria-label': 'Search users', style: 'max-width:320px' });
    search.addEventListener('keydown', (e) => e.key === 'Enter' && show('users', search.value));
    const reload = () => show('users', search.value);
    view.replaceChildren(
      h('div', { class: 'row', style: 'margin-bottom:1rem' }, search, h('button', { class: 'btn sm', onclick: reload }, 'Search')),
      h('div', { class: 'panel tablewrap' }, h('table', {},
        h('tr', {}, ['User', 'Plan', 'WhatsApp', 'Joined', 'Status', 'Actions'].map((t) => h('th', {}, t))),
        rows.map((u) => h('tr', {},
          h('td', {}, h('strong', {}, u.name), h('br'), h('span', { class: 'small muted' }, u.email)),
          h('td', {}, h('span', { class: 'badge ' + (u.plan === 'premium' ? 'pro' : '') }, u.plan), u.plan === 'premium' ? h('div', { class: 'small muted' }, 'until ' + fmtDate(u.premium_until)) : null),
          h('td', {}, u.wa_status || 'idle', u.phone ? h('div', { class: 'small muted' }, '+' + u.phone) : null),
          h('td', {}, fmtDate(u.created_at)),
          h('td', {}, u.banned ? h('span', { class: 'badge bad', title: u.ban_reason || '' }, 'banned') : h('span', { class: 'badge ok' }, u.role === 'admin' ? 'admin' : 'active')),
          h('td', {}, u.role === 'admin' ? '-' : h('div', { class: 'row', style: 'gap:.4rem' },
            u.banned
              ? h('button', { class: 'btn sm', onclick: (e) => act(e.target, async () => { await api(`/admin/users/${u.id}/ban`, 'POST', { banned: false }); reload(); }, 'Unbanned') }, 'Unban')
              : h('button', { class: 'btn sm danger', onclick: (e) => { const reason = prompt('Reason for ban (optional):'); if (reason === null) return; act(e.target, async () => { await api(`/admin/users/${u.id}/ban`, 'POST', { banned: true, reason }); reload(); }, 'User banned'); } }, 'Ban'),
            h('button', { class: 'btn sm', onclick: (e) => { const d = prompt('Grant Premium for how many days?', '30'); if (d === null) return; act(e.target, async () => { await api(`/admin/users/${u.id}/plan`, 'POST', { plan: 'premium', days: d }); reload(); }, 'Premium granted'); } }, 'Give Premium'),
            u.plan === 'premium' ? h('button', { class: 'btn sm', onclick: (e) => act(e.target, async () => { await api(`/admin/users/${u.id}/plan`, 'POST', { plan: 'free' }); reload(); }, 'Moved to Free') }, 'Make Free') : null,
            h('button', { class: 'btn sm', onclick: (e) => confirm("Disconnect this user's WhatsApp?") && act(e.target, async () => { await api(`/admin/users/${u.id}/disconnect`, 'POST'); reload(); }, 'Disconnected') }, 'Disconnect'),
            h('button', { class: 'btn sm danger', onclick: (e) => confirm(`Delete ${u.email} and all their data?`) && act(e.target, async () => { await api(`/admin/users/${u.id}`, 'DELETE'); reload(); }, 'User deleted') }, 'Delete'))))))));
  }

  async function payments(status = 'pending') {
    const rows = await api('/admin/payments?status=' + status);
    const sel = h('select', { 'aria-label': 'Filter payments', style: 'max-width:200px', onchange: (e) => show('payments', e.target.value) },
      ['pending', 'confirmed', 'rejected', ''].map((s) => h('option', { value: s, selected: s === status }, s || 'all')));
    const reload = () => show('payments', sel.value);
    view.replaceChildren(h('div', { class: 'row', style: 'margin-bottom:1rem' }, sel),
      rows.length ? h('div', { class: 'panel tablewrap' }, h('table', {},
        h('tr', {}, ['Date', 'User', 'Amount', 'Reference', 'Note', 'Status', 'Actions'].map((t) => h('th', {}, t))),
        rows.map((p) => h('tr', {}, h('td', {}, fmtDate(p.created_at)),
          h('td', {}, p.name, h('br'), h('span', { class: 'small muted' }, p.email)),
          h('td', {}, money(p.amount, p.currency)), h('td', {}, h('strong', {}, p.reference)), h('td', {}, p.note || '-'),
          h('td', {}, h('span', { class: 'badge ' + ({ confirmed: 'ok', rejected: 'bad', pending: 'warn' }[p.status]) }, p.status)),
          h('td', {}, p.status === 'pending' ? h('div', { class: 'row', style: 'gap:.4rem' },
            h('button', { class: 'btn sm primary', onclick: (e) => act(e.target, async () => { await api(`/admin/payments/${p.id}/confirm`, 'POST'); reload(); }, 'Payment confirmed, Premium activated') }, 'Confirm'),
            h('button', { class: 'btn sm danger', onclick: (e) => act(e.target, async () => { await api(`/admin/payments/${p.id}/reject`, 'POST'); reload(); }, 'Payment rejected') }, 'Reject')) : '-')))))
        : h('p', { class: 'muted' }, 'No payments here.'));
  }

  async function settings() {
    const s = await api('/admin/settings');
    const fields = [['price', 'Premium price', 'number'], ['currency', 'Currency code (e.g. USD, NGN)', 'text'],
      ['premium_days', 'Days of Premium per payment', 'number'], ['free_daily_limit', 'Free replies per day', 'number'],
      ['bank_name', 'Bank name', 'text'], ['account_number', 'Account number', 'text'], ['account_name', 'Account name', 'text'],
      ['payment_instructions', 'Payment instructions shown to users', 'textarea']];
    const inputs = {};
    view.replaceChildren(h('div', { class: 'panel' }, h('h2', {}, 'Pricing and payment details'),
      fields.map(([k, label, type]) => {
        inputs[k] = type === 'textarea' ? h('textarea', { id: 's-' + k }, s[k]) : h('input', { id: 's-' + k, type, value: s[k], step: 'any', min: type === 'number' ? '0' : null });
        return h('div', { class: 'field' }, h('label', { for: 's-' + k }, label), inputs[k]);
      }),
      h('button', { class: 'btn primary', onclick: (e) => act(e.target, async () => {
        const body = {}; for (const [k] of fields) body[k] = inputs[k].value;
        await api('/admin/settings', 'POST', body);
      }, 'Settings saved') }, 'Save settings')));
  }
  show('overview');
}

    h('h2', {}, '1. The service'), h('p', {}, 'Echoreply lets you link your WhatsApp account so that an AI writes automatic replies in your texting style. You decide when it is on, and you can pause or disconnect at any time.'),

    h('h2', {}, '3. WhatsApp risk'), h('p', {}, 'Echoreply connects in the same way as WhatsApp Web and is not affiliated with or endorsed by WhatsApp or Meta. WhatsApp may limit or ban accounts that use automation. You use the service at your own risk and we are not liable for any restriction placed on your number.'),
    h('h2', {}, '4. Plans and payment'), h('p', {}, 'The Free plan has a daily reply limit. Premium is paid by bank transfer, is activated after we confirm your payment, and lasts for the period shown at checkout. Prices can change for future payments. Payments are non-refundable unless the law says otherwise.'),
    h('h2', {}, '5. Suspension'), h('p', {}, 'We may suspend or ban accounts that break these terms or put the service at risk. A suspended account is disconnected from WhatsApp immediately.'),
    h('h2', {}, '6. No guarantees'), h('p', {}, 'AI replies can be wrong or inappropriate. Review how it behaves, keep the automated-reply notice on where the law requires it, and do not rely on it for important, financial, legal or safety-related conversations. The service is provided "as is".'),
    h('h1', { style: 'font-size:2.4rem;margin-top:3rem', id: 'privacy' }, 'Privacy Policy'),
    h('h2', {}, 'What we collect'),
    h('ul', {}, L('Account data: ', 'name, email, hashed password, plan and payment references.'),

    h('h2', {}, 'How messages are processed'), h('p', {}, "When someone messages you, the message text, recent messages in that chat and your style samples are sent to our AI provider (Anthropic) to write a reply, then discarded by us. Please check the provider's own privacy terms."),
    h('h2', {}, "Contacts' rights"), h('p', {}, "Anyone who receives an automatic reply can send STOP to opt out. We store only a one-way hash of the contact's identifier for this purpose, not their phone number."),
    h('h2', {}, 'Your rights'), h('p', {}, 'You can withdraw consent (which disconnects WhatsApp and deletes the session and style samples) or delete your account from the dashboard at any time. For other requests, contact us at the email shown on the site.'),
    h('p', {}, h('a', { href: '#/' }, 'Back to home'))));
  const el = document.getElementById(scrollTo);

/* ---------- router ---------- */
function route() {
  timers.forEach((t) => { clearTimeout(t); clearInterval(t); });
  timers = []; routeId++;
  document.querySelectorAll('.overlay').forEach((o) => o.remove());
  window.scrollTo(0, 0);
  const page = (location.hash.replace(/^#\/?/, '').split('?')[0]) || '';
  document.title = 'Echoreply';
  if (page === 'login') authView(false);
  else if (page === 'register') authView(true);
  else if (page === 'dashboard') dashboard();
  else if (page === 'admin') admin();
  else if (page === 'terms' || page === 'privacy') legal(page);
  else landing();
}
window.addEventListener('hashchange', route);
route();
